
name: "Code Analysis"

on:
  push:
  pull_request:

jobs:
  lint:
    name: Run Linter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Run Linter
        run: |
          docker run --rm -v $PWD:/app composer:2.0 sh -c \
          "composer install --profile --ignore-platform-reqs && composer check && composer lint"

